
name: Update PHP versions

on:
  schedule:
    # cron format is: min, hr, day of the month, month, day of the week. Astrisk means every instance of that.
    # EG: IF * on the day of the week, it would run daily
    # cron: '17 */6 * * *' <-- this means it runs at 17mins past the hr every 6 hrs
    - cron: '17 6 * * *' # Runs at 06:17 daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch PHP versions
        run: |
          curl -fsSL https://www.php.net/releases/branches.php \
            | jq '
                map({
                  key: ("php" + (.branch | gsub("\\."; ""))),
                  value: {
                    latest: .latest,
                    state: .state
                  }
                })
                | from_entries
              ' > versions.json

      - name: Update latest.json
        run: |
          # Extract existing version data without the timestamp
          if [ -f latest.json ]; then
            jq 'del(.file_last_updated)' latest.json > old-versions.json
          else
            echo '{}' > old-versions.json
          fi

          # Only update if PHP version data has changed
          if ! diff -q old-versions.json versions.json > /dev/null; then
            jq --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              '. + {file_last_updated: $timestamp}' \
              versions.json > latest.json

            echo "PHP versions updated."
          else
            echo "No PHP version changes detected."
          fi

      - name: Commit changes
        run: |
          if ! git diff --quiet latest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.json
            git commit -m "Update PHP versions"
            git push
          else
            echo "No changes to commit."
          fi
